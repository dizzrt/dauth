syntax = "proto3";

package identity;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/dizzrt/dauth/api/gen/identity;identity";

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;

  ENABLED = 1; // 启用
  DISABLED = 2; // 禁用
  LOCKED = 3; // 锁定（密码/MFA验证失败触发）
}

message UserExtend {}

message User {
  optional uint32 uid = 1;
  optional string username = 2;
  optional UserStatus status = 7;
  optional string phone = 3;
  optional string email = 4;
  optional string nickname = 5;
  optional string avatar = 6;
  optional UserExtend extend = 8;
  optional google.protobuf.Timestamp last_login_at = 9;
  optional google.protobuf.Timestamp created_at = 10;
  optional google.protobuf.Timestamp updated_at = 11;
  optional google.protobuf.Timestamp deleted_at = 12;
}
