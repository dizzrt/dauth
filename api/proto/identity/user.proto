syntax = "proto3";

package identity;

import "common/base.proto";
import "google/api/annotations.proto";
import "identity/types.proto";

option go_package = "github.com/dizzrt/dauth/api/gen/identity;identity";

message CreateUserRequest {
  string password = 1;
  optional string username = 2;
  optional string phone = 3;
  optional string email = 4;
  optional string nickname = 5;
  optional UserStatus status = 6;
  optional UserExtend extend = 7;

  common.Base base = 255;
}

message CreateUserResponse {
  User user = 1;

  common.BaseResp base_resp = 255;
}

message GetUserRequest {
  uint32 uid = 1;

  common.Base base = 255;
}

message GetUserResponse {
  User user = 1;

  common.BaseResp base_resp = 255;
}

service UserService {
  // CreateUser creates a new user.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = {
      post: "/identity/user"
      body: "*"
    };
  }

  // GetUser gets a user by ID.
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (google.api.http) = {get: "/identity/user/{uid}"};
  }
}
